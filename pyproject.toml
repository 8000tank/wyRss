[project]
name = "readwise-digest"
version = "0.1.0"
description = "Readwise Reader daily digest generator with LLM scoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "lark-oapi>=1.5.3",
    "mistune>=3.2.0",
    "feedparser>=6.0.12",
    "trafilatura>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
]

[project.scripts]
readwise-digest = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "integration: marks tests that make real API calls",
    "slow: marks tests as slow",
]

[tool.uv.pip]
generate-hashes = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "responses>=0.26.0",
]
